<div id="lecture-card" class="bg-slate-800 rounded-3xl border border-slate-700 shadow-sm overflow-hidden w-full flex flex-col h-[85vh] md:h-[500px]">
  
  <div class="px-4 py-3 sm:px-6 sm:py-4 border-b border-slate-700 flex items-center justify-between shrink-0 bg-slate-800/50">
    <div class="flex items-center gap-3 sm:gap-4 overflow-hidden">
      <span class="p-2 bg-brand-900/30 border border-brand-800 rounded-lg text-brand-400 shrink-0">
        <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
        </svg>
      </span>
      <div class="flex flex-col truncate">
        <span class="text-xs sm:text-sm font-bold text-slate-400 uppercase tracking-wider truncate">Desenvolvimento Humano</span>
        <h2 id="lecture-title" class="text-base sm:text-xl md:text-2xl font-extrabold text-slate-200 truncate">Epistemologia e Vida</h2>
      </div>
    </div>
    <div class="hidden sm:flex text-xs font-bold text-slate-400 bg-slate-900/50 px-3 py-1.5 rounded-full border border-slate-700">
      Toque em qualquer frase para reproduzir o áudio
    </div>
  </div>

  <div id="lecture-script" lang="pt-BR" style="text-align: justify; hyphens: auto; text-justify: inter-word;" class="p-4 sm:p-6 overflow-y-auto flex-1 text-slate-400 text-lg sm:text-xl md:text-lg leading-relaxed space-y-4 sm:space-y-5 font-normal select-none font-sans">
  </div>

  <div class="bg-slate-900 text-slate-100 p-3 sm:p-4 border-t border-slate-800 shrink-0 space-y-2.5">
    <div class="flex items-center gap-3 sm:gap-4">
      <input type="range" id="audio-scrubber" min="0" value="0" oninput="scrubLecture(this.value)" class="flex-1 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-brand-500 hover:accent-brand-400 transition-all">
      <span id="audio-current-time" class="text-sm font-mono text-slate-400 min-w-[65px] text-right">0 / 0</span>
    </div>
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-1 sm:gap-2">
        <button onclick="previousSentence()" class="p-1.5 text-slate-400 hover:text-slate-200 rounded-lg transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4z"></path></svg>
        </button>
        <button onclick="toggleLectureAudio()" id="btn-audio-play" class="p-2 sm:p-2.5 bg-brand-600 hover:bg-brand-500 text-slate-200 rounded-full transition transform hover:scale-105">
          <svg id="play-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
          <svg id="pause-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
        </button>
        <button onclick="stopLectureAudio()" class="p-1.5 text-slate-400 hover:text-slate-200 rounded-lg transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
        </button>
        <button onclick="nextSentence()" class="p-1.5 text-slate-400 hover:text-slate-200 rounded-lg transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7"></path></svg>
        </button>
      </div>
      <div class="flex items-center gap-2 sm:gap-4 bg-slate-800/50 p-1 sm:p-1.5 rounded-xl border border-slate-700">
        <select id="audio-voice" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs sm:text-sm text-slate-200 focus:outline-none w-full max-w-[120px] sm:max-w-[150px] truncate"></select>
        <div class="h-6 w-px bg-slate-700 hidden sm:block"></div>
        <div class="flex items-center gap-2 pr-2">
          <input type="range" id="audio-speed" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateLectureSpeed()" class="w-10 sm:w-12 h-1 bg-slate-700 rounded appearance-none cursor-pointer accent-brand-500">
          <span id="speed-val" class="text-[11px] sm:text-xs text-slate-300 font-bold min-w-[20px]">1.0x</span>
        </div>
      </div>
    </div>
  </div>
</div>
