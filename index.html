<!DOCTYPE html>
<html lang="pt-PT" class="h-full bg-slate-900">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comportamento Humano - Plataforma de Estudos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./central-cores.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: 'var(--brand-500)',
                            600: 'var(--brand-600)',
                            700: 'var(--brand-700)',
                            900: 'var(--brand-900)',
                        },
                        luz: {
                            verde: 'var(--luz-verde)',
                            coral: 'var(--luz-coral)',
                            ouro: 'var(--luz-ouro)'
                        },
                        // Necessário para o botão conseguir inverter as cores do fundo e textos
                        slate: {
                            100: 'var(--slate-100)',
                            200: 'var(--slate-200)',
                            300: 'var(--slate-300)',
                            400: 'var(--slate-400)',
                            500: 'var(--slate-500)',
                            600: 'var(--slate-600)',
                            700: 'var(--slate-700)',
                            800: 'var(--slate-800)',
                            900: 'var(--slate-900)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        html {
            scroll-behavior: smooth;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        circle.cursor-pointer {
            transition: stroke 0.2s ease, fill 0.2s ease;
        }

        circle.cursor-pointer:hover {
            stroke: #94a3b8;
        }

        circle.active-ring {
            stroke: #0ea5e9 !important;
        }

        circle.active-ring:hover {
            stroke: #0ea5e9 !important;
        }

        #ring-indiv:hover {
            fill: #0369a1;
        }

        #ring-indiv.active-ring {
            fill: #0ea5e9 !important;
        }
    </style>
</head>

<body class="h-full flex flex-col font-sans text-slate-200 antialiased overflow-hidden">

    <div class="flex h-full w-full overflow-hidden relative">

        <aside id="sidebar"
            class="fixed md:static inset-y-0 left-0 z-40 w-72 md:w-80 flex flex-col bg-slate-900 text-slate-100 flex-shrink-0 border-r border-slate-800 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out h-full shadow-2xl md:shadow-none">

            <div class="p-6 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div onclick="toggleTheme()" title="Modo Claro/Escuro"
                        class="p-2 bg-brand-700 rounded-lg text-slate-200 cursor-pointer">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-m font-bold tracking-wide uppercase text-brand-700">Pós-Graduação</h1>
                        <p class="text-m text-slate-400">Comportamento Humano</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-400 hover:text-slate-200 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <nav id="modulos-menu" class="flex-1 overflow-y-auto p-4 space-y-2">
                <button data-modulo="1"
                    class="modulo-btn w-full flex items-center justify-between p-3.5 rounded-xl transition-all duration-200 text-left bg-brand-700 text-slate-200 shadow-lg shadow-brand-700/10">
                    <div class="flex items-center space-x-3 min-w-0">
                        <span class="block text-base text-slate-200 font-bold truncate">Módulo 1: Epistemologia</span>
                    </div>
                </button>
                <button data-modulo="2"
                    class="modulo-btn w-full flex items-center justify-between p-3.5 rounded-xl transition-all duration-200 text-left text-slate-400 hover:bg-slate-800">
                    <div class="flex items-center space-x-3 min-w-0">
                        <span class="block text-base font-bold truncate">Módulo 2</span>
                    </div>
                </button>
                <button data-modulo="3"
                    class="modulo-btn w-full flex items-center justify-between p-3.5 rounded-xl transition-all duration-200 text-left text-slate-400 hover:bg-slate-800">
                    <div class="flex items-center space-x-3 min-w-0">
                        <span class="block text-base font-bold truncate">Módulo 3</span>
                    </div>
                </button>
                <button data-modulo="4"
                    class="modulo-btn w-full flex items-center justify-between p-3.5 rounded-xl transition-all duration-200 text-left text-slate-400 hover:bg-slate-800">
                    <div class="flex items-center space-x-3 min-w-0">
                        <span class="block text-base font-bold truncate">Módulo 4</span>
                    </div>
                </button>
                <button data-modulo="5"
                    class="modulo-btn w-full flex items-center justify-between p-3.5 rounded-xl transition-all duration-200 text-left text-slate-400 hover:bg-slate-800">
                    <div class="flex items-center space-x-3 min-w-0">
                        <span class="block text-base font-bold truncate">Módulo 5</span>
                    </div>
                </button>
                <button data-modulo="6"
                    class="modulo-btn w-full flex items-center justify-between p-3.5 rounded-xl transition-all duration-200 text-left text-slate-400 hover:bg-slate-800">
                    <div class="flex items-center space-x-3 min-w-0">
                        <span class="block text-base font-bold truncate">Módulo 6</span>
                    </div>
                </button>
                <button data-modulo="7"
                    class="modulo-btn w-full flex items-center justify-between p-3.5 rounded-xl transition-all duration-200 text-left text-slate-400 hover:bg-slate-800">
                    <div class="flex items-center space-x-3 min-w-0">
                        <span class="block text-base font-bold truncate">Módulo 7</span>
                    </div>
                </button>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 bg-slate-900 relative overflow-hidden">

            <header
                class="bg-slate-900 border-b border-slate-800 px-4 py-3 sm:px-6 flex flex-col md:flex-row md:items-center justify-between gap-2 z-10 shrink-0 shadow-sm">
                <div class="flex items-center space-x-2 min-w-0 w-full md:w-auto">
                    <button onclick="toggleSidebar()"
                        class="md:hidden text-slate-400 hover:text-slate-200 shrink-0 p-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <div class="flex items-center space-x-1.5 min-w-0 flex-nowrap overflow-hidden">
                        <span id="header-modulo-badge"
                            class="text-lg sm:text-xl font-extrabold text-brand-700 uppercase tracking-wide shrink-0">Módulo
                            1</span>
                        <span class="text-slate-600 font-bold shrink-0 hidden sm:inline">-</span>
                        <h2 id="header-modulo-title"
                            class="text-lg sm:text-xl font-bold text-slate-400 truncate shrink">Epistemologia e Vida
                        </h2>
                    </div>
                </div>

                <div
                    class="flex items-center space-x-2 text-base sm:text-lg md:text-xl overflow-x-auto scrollbar-hide w-full md:w-auto justify-center md:justify-end shrink-0">
                    <button data-tab="intro"
                        class="tab-btn px-4 py-2 bg-brand-700 text-slate-200 rounded-lg transition font-extrabold whitespace-nowrap shadow-sm">Intro</button>
                    <button data-tab="analise"
                        class="tab-btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-brand-500 rounded-lg transition font-extrabold whitespace-nowrap shadow-sm">Análise</button>
                    <button data-tab="graficos"
                        class="tab-btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-brand-500 rounded-lg transition font-extrabold whitespace-nowrap shadow-sm">Gráficos</button>
                    <button data-tab="quiz"
                        class="tab-btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-brand-500 rounded-lg transition font-extrabold whitespace-nowrap shadow-sm">Quiz</button>
                </div>
            </header>

            <div id="content-viewport" class="flex-1 overflow-y-auto px-2 sm:px-6 py-1 ">
                <div id="view-target" class="max-w-4xl mx-auto w-full pb-10">
                </div>
            </div>
        </main>
    </div>

    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-[60] w-full h-full"></canvas>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
            } else {
                sidebar.classList.add('-translate-x-full');
            }
        }

        // LÓGICA DO BOTÃO DO LIVRO ADICIONADA AQUI
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('light');

            if (html.classList.contains('light')) {
                localStorage.setItem('theme', 'light');
            } else {
                localStorage.setItem('theme', 'dark');
            }
        }

        // Mantém a escolha do usuário se ele atualizar a página
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light');
        }
    </script>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
