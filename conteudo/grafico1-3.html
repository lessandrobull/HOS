<div class="flex flex-col h-full w-full gap-3 justify-between py-1 overflow-hidden">
  <div id="persp-buttons-bar" class="flex flex-wrap md:flex-nowrap justify-center gap-1 sm:gap-2 px-1 w-full shrink-0">
    <button onclick="selectPerspective('psicanalitica')" id="btn-p-psicanalitica" class="py-2.5 sm:py-3.5 md:py-1 px-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm sm:text-base font-extrabold rounded-xl transition shadow-sm truncate">Psicanalítica</button>
    <button onclick="selectPerspective('aprendizagem')" id="btn-p-aprendizagem" class="py-2.5 sm:py-3.5 md:py-1 px-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm sm:text-base font-extrabold rounded-xl transition shadow-sm truncate">Aprendizagem</button>
    <button onclick="selectPerspective('cognitiva')" id="btn-p-cognitiva" class="py-2.5 sm:py-3.5 md:py-1 px-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm sm:text-base font-extrabold rounded-xl transition shadow-sm truncate">Cognitiva</button>
    <button onclick="selectPerspective('contextual')" id="btn-p-contextual" class="py-2.5 sm:py-3.5 md:py-1 px-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm sm:text-base font-extrabold rounded-xl transition shadow-sm truncate">Contextual</button>
    <button onclick="selectPerspective('evolucionista')" id="btn-p-evolucionista" class="py-2.5 sm:py-3.5 md:py-1 px-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm sm:text-base font-extrabold rounded-xl transition shadow-sm truncate whitespace-nowrap">Evolucionista</button>
  </div>

  <div class="flex-1 bg-slate-900/50 p-4 rounded-2xl border border-slate-700 flex flex-col justify-center items-center space-y-3 overflow-hidden text-center">
    <div class="flex justify-center items-center gap-2 mb-1">
      <span id="persp-badge" class="px-3 py-1 bg-brand-600 text-slate-300 font-extrabold rounded-md text-sm sm:text-base uppercase tracking-wider">Teorias</span>
      <span id="persp-reference" class="text-sm sm:text-base text-slate-400 font-bold truncate"></span>
    </div>
    <h3 id="persp-title" class="text-xl sm:text-3xl md:text-2xl font-extrabold text-slate-300 mt-0.5 leading-tight text-center">Escolha a Lente Teórica</h3>
    <p id="persp-def" class="text-base sm:text-xl text-slate-400 leading-relaxed text-center line-clamp-3">Mapeia as origens do comportamento através de filtros científicos específicos.</p>

    <div id="persp-details-grid" class="hidden mt-2 pt-2 border-t border-slate-700 w-full flex flex-col justify-center items-center space-y-1.5 text-center">
      <div class="text-sm sm:text-base md:text-lg text-slate-300 leading-snug flex flex-col sm:flex-row items-center justify-center gap-1">
        <strong id="persp-col-1-title" class="text-brand-400 md:text-base">Conceito:</strong>
        <span id="persp-col-1-text" class="text-slate-400 font-medium"></span>
      </div>
      <div class="text-sm sm:text-base md:text-lg text-slate-300 leading-snug flex flex-col sm:flex-row items-center justify-center gap-1">
        <strong id="persp-col-2-title" class="text-brand-400 md:text-base">Aplicação:</strong>
        <span id="persp-col-2-text" class="text-slate-400 font-medium"></span>
      </div>
    </div>
  </div>
</div>

<script>
const PERSPECTIVE_DATA = {
    psicanalitica: { badge: "Perspectiva", ref: "[Cap. 2]", title: "Psicanalítica", def: "O comportamento humano é impulsionado por forças emocionais profundas inconscientes e crises psicossociais não solucionadas.", col1_title: "Foco", col1_text: "Conflitos de base e traumas infantis manifestos na vida adulta.", col2_title: "Uso", col2_text: "Desvendar autodefesas, loops e autossabotagens." },
    aprendizagem: { badge: "Perspectiva", ref: "[Aula 12]", title: "Aprendizagem", def: "O comportamento é moldado por recompensas, punições e pela modelagem social direta (Bandura).", col1_title: "Foco", col1_text: "Mecânica observável de causa e efeito das respostas aprendidas.", col2_title: "Uso", col2_text: "Mapear como vícios foram gravados pelo piloto automático." },
    cognitiva: { badge: "Perspectiva", ref: "[Aula 13]", title: "Cognitiva", def: "Estuda o processamento interno de informações lógicas, estruturação do pensamento e esquemas de crenças.", col1_title: "Foco", col1_text: "Como os esquemas mentais rígidos decodificam a realidade.", col2_title: "Uso", col2_text: "Explicar névoas mentais e loops obsessivos (Ad) de Ricardo." },
    contextual: { badge: "Perspectiva", ref: "[Aula 21]", title: "Contextual (Bioecológica)", def: "A teoria (Bronfenbrenner) que estuda o ser humano como reflexo de seu ecossistema vivo e concêntrico de influências mútuas.", col1_title: "Foco", col1_text: "A retroalimentação contínua dos múltiplos sistemas sociais.", col2_title: "Uso", col2_text: "Somatização como feedback recursivo às desregulações do ambiente." },
    evolucionista: { badge: "Perspectiva", ref: "[Aula 06]", title: "Evolucionista (Darwin)", def: "Analisa o comportamento através do valor adaptativo e de sobrevivência que as respostas orgânicas desempenham para a espécie.", col1_title: "Foco", col1_text: "Reações reflexas autonômicas e impulsos instintivos.", col2_title: "Uso", col2_text: "Desvendar os ataques ou fugas (sequestro) do cérebro reptiliano." }
};

function selectPerspective(pId) {
    const data = PERSPECTIVE_DATA[pId];
    const bar = document.getElementById("persp-buttons-bar");
    if (bar) {
        bar.querySelectorAll("button").forEach(btn => {
            btn.className = "py-2.5 sm:py-3.5 md:py-1 px-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm sm:text-base font-extrabold rounded-xl transition shadow-sm truncate";
        });
    }
    const activeBtn = document.getElementById(`btn-p-${pId}`);
    if (activeBtn) {
        activeBtn.className = "py-2.5 sm:py-3.5 md:py-1 px-2 bg-brand-600 text-slate-200 text-sm sm:text-base font-extrabold rounded-xl transition shadow-md shadow-brand-600/10 truncate";
    }
    document.getElementById("persp-badge").textContent = data.badge;
    document.getElementById("persp-badge").className = "px-3 py-1 bg-brand-600 text-slate-200 font-extrabold rounded-md text-sm sm:text-base uppercase tracking-wider";
    document.getElementById("persp-reference").textContent = data.ref;
    document.getElementById("persp-title").textContent = data.title;
    document.getElementById("persp-def").textContent = data.def;
    document.getElementById("persp-col-1-title").className = "text-brand-400 md:text-base";
    document.getElementById("persp-col-1-title").textContent = data.col1_title + ":";
    document.getElementById("persp-col-1-text").textContent = data.col1_text;
    document.getElementById("persp-col-2-title").className = "text-brand-400 md:text-base";
    document.getElementById("persp-col-2-title").textContent = data.col2_title + ":";
    document.getElementById("persp-col-2-text").textContent = data.col2_text;
    document.getElementById("persp-details-grid").classList.remove("hidden");
}
</script>
