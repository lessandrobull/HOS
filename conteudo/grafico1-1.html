<div class="flex flex-col md:flex-row h-full w-full gap-1 md:gap-4 items-center justify-center overflow-hidden">

  <div class="shrink-0 flex justify-center items-center w-full md:w-1/2 h-[325px] md:h-[400px] overflow-hidden p-0">
    <svg class="w-[98%] h-[98%] max-w-full max-h-full object-contain mx-auto" viewBox="0 0 400 400" id="bio-svg">
      <circle cx="200" cy="200" r="195" fill="transparent" stroke="var(--slate-700)" stroke-width="1" stroke-dasharray="4" />
      <circle cx="200" cy="200" r="155" fill="transparent" stroke="var(--slate-700)" stroke-width="1" stroke-dasharray="4" />
      <circle cx="200" cy="200" r="115" fill="transparent" stroke="var(--slate-700)" stroke-width="1" stroke-dasharray="4" />
      <circle cx="200" cy="200" r="75" fill="transparent" stroke="var(--slate-700)" stroke-width="1" stroke-dasharray="4" />

      <circle id="ring-crono" cx="200" cy="200" r="185" fill="none" stroke="var(--slate-600)" stroke-width="26"
        class="cursor-pointer" onclick="selectRing('crono')" />
      <text x="200" y="23" font-size="20" font-weight="extrabold" fill="var(--text-svg-light)" text-anchor="middle"
        pointer-events="none">CRONOSSISTEMA</text>

      <circle id="ring-macro" cx="200" cy="200" r="150" fill="none" stroke="var(--slate-600)" stroke-width="26"
        class="cursor-pointer" onclick="selectRing('macro')" />
      <text x="200" y="58" font-size="20" font-weight="extrabold" fill="var(--text-svg-light)" text-anchor="middle"
        pointer-events="none">MACROSSISTEMA</text>

      <circle id="ring-exo" cx="200" cy="200" r="115" fill="none" stroke="var(--slate-600)" stroke-width="26"
        class="cursor-pointer" onclick="selectRing('exo')" />
      <text x="200" y="93" font-size="20" font-weight="extrabold" fill="var(--text-svg-light)" text-anchor="middle"
        pointer-events="none">EXOSSISTEMA</text>

      <circle id="ring-micro" cx="200" cy="200" r="80" fill="none" stroke="var(--slate-600)" stroke-width="26"
        class="cursor-pointer" onclick="selectRing('micro')" />
      <text x="200" y="128" font-size="20" font-weight="extrabold" fill="var(--text-svg-light)" text-anchor="middle"
        pointer-events="none">MICROSSISTEMA</text>

      <circle id="ring-indiv" cx="200" cy="200" r="45" fill="var(--brand-600)" class="cursor-pointer"
        onclick="selectRing('indiv')" />
      <text x="200" y="205" font-size="18" font-weight="extrabold" fill="var(--text-svg-lighter)" text-anchor="middle"
        pointer-events="none">INDIVÍDUO</text>
    </svg>
  </div>

  <div
    class="flex-1 w-full md:w-1/2 bg-slate-900/50 p-2 md:p-4 rounded-2xl border border-slate-700 flex flex-col justify-center items-center overflow-hidden space-y-0.5 md:space-y-2">
    <div class="flex justify-center items-center gap-2 mb-1 md:mb-2">
      <span id="ring-badge"
        class="px-3 py-1 bg-brand-600 text-slate-200 font-extrabold rounded-md text-sm sm:text-base uppercase tracking-wider">Influências
        ambientais</span>
      <span id="ring-reference" class="text-sm sm:text-base text-slate-400 font-bold truncate"></span>
    </div>
    <h3 id="ring-title" class="text-lg sm:text-3xl font-extrabold text-slate-300 mt-1 leading-tight text-center">Toque
      nos anéis</h3>
    <p id="ring-def" class="text-sm sm:text-xl text-slate-400 leading-relaxed text-center line-clamp-4">Interaja com as
      camadas do diagrama para carregar as definições ecológicas e associações comportamentais do Índice.</p>
    <div id="ring-association-box"
      class="hidden pt-2 border-t border-slate-700 text-sm sm:text-lg text-slate-400 leading-snug line-clamp-3 text-center w-full">
      <strong class="text-brand-400 font-extrabold mr-1">Aplicação:</strong> <span id="ring-association"></span>
    </div>
  </div>
</div>

<script>
  const RING_DATA = {
    indiv: { badge: "Indivíduo", ref: "[Cap. 1]", title: "Dimensões e Maturação", def: "A base apoia-se na hereditariedade (genética) e maturação (desabrochar neural do cérebro). Dimensões: Física, Cognitiva e Psicossocial.", assoc: "Mostra que o comportamento do sujeito é o resultado de predisposições ativadas pela dinâmica do meio." },
    micro: { badge: "Microssistema", ref: "[Aula 21]", title: "Família e Laços Básicos", def: "Relações e ambientes de contato face a face. Família nuclear (pais/filhos) e estendida (rede de parentesco expandida).", assoc: "Estrutura básica de apoio onde são geradas as primeiras crenças e regras invisíveis de comportamento." },
    exo: { badge: "Exossistema", ref: "[Aula 02]", title: "NSE e Vizinhança", def: "Ambientes sociais que influenciam indiretamente. Nível Socioeconômico (renda, educação) e a segurança/pressões físicas da vizinhança.", assoc: "Analisa se o meio é um fator de proteção ou risco que dispara o estresse crônico inescapável." },
    macro: { badge: "Macrossistema", ref: "[Cap. 1]", title: "Cultura e Grupo Étnico", def: "Os grandes padrões e ideologias globais: modo de vida da sociedade, valores, identidade, ancestralidade compartilhada e tabus.", assoc: "Os filtros ético-morais inconscientes e regras de validação profunda que guiam as decisões vitais." },
    crono: { badge: "Cronossistema", ref: "[Cap. 1]", title: "Contexto Histórico", def: "Insere a dimensão temporal. Refere-se às influências do momento histórico, como pandemias, guerras e a transição da era digital.", assoc: "Prova que o comportamento de um sujeito hoje é modelado por contextos díspares dos de seus pais." }
  };

  function selectRing(ringId) {
    const data = RING_DATA[ringId];
    const svg = document.getElementById("bio-svg");
    if (svg) {
      svg.querySelectorAll("circle").forEach(circle => circle.classList.remove("active-ring"));
    }
    const targetRing = document.getElementById(`ring-${ringId}`);
    if (targetRing) targetRing.classList.add("active-ring");

    document.getElementById("ring-badge").textContent = data.badge;
    document.getElementById("ring-reference").textContent = data.ref;
    document.getElementById("ring-title").textContent = data.title;
    document.getElementById("ring-def").textContent = data.def;
    document.getElementById("ring-association").textContent = data.assoc;
    document.getElementById("ring-association-box").classList.remove("hidden");
  }
</script>
